name: design-gate
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gate built pages
        run: node design-gate.mjs $(find dist -name "*.html") --md design-report.md --fail-on warn
