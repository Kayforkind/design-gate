name: design-gate
on:
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build site
        run: npm run build --if-present
      - name: Gate built pages
        run: |
          files=$(find dist -name "*.html")
          if [ -z "$files" ]; then echo "design-gate: no HTML files found in dist/"; exit 1; fi
          node design-gate.mjs $files --md design-report.md --fail-on warn
      - name: Show report
        if: always()
        run: '[ -f design-report.md ] && cat design-report.md >> "$GITHUB_STEP_SUMMARY" || true'
